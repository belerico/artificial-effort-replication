[project]
name = "artificial-effort-replication"
version = "1.0.0"
description = "Replication package for the Artificial Effort paper"
requires-python = "==3.12.*"
# Analysis: everything needed to reproduce the figures, tables and numbers.
dependencies = [
    "matplotlib==3.10.8",
    "numpy==2.4.3",
    "pandas==3.0.1",
    "scipy==1.17.1",
    "seaborn==0.13.2",
    "statsmodels==0.14.6",
]

[dependency-groups]
# Data collection: the oTree experiment and the LLM runner (collection/real_effort).
collection = [
    "openai==2.24.0",
    "otree==6.0.11",
    "pillow==12.1.1",
    "playwright==1.64.1",
    "py-sudoku==2.0.0",
    "pyyaml==6.0.3",
]

[tool.uv]
package = false
override-dependencies = ["markupsafe==1.1.1"]
# Transitive versions of the environment the paper's outputs were produced with.
constraint-dependencies = [
    "contourpy==1.3.3",
    "fonttools==4.61.1",
    "kiwisolver==1.4.9",
    "packaging==26.0",
    "patsy==1.0.2",
    "pyparsing==3.3.2",
    "python-dateutil==2.9.0.post0",
]
